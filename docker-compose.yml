name: service-scheduler

services:
  api:
    build: .
    image: service-scheduler:local
    init: true
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler
      OTEL_SERVICE_NAME: service-scheduler
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  migrate:
    build: .
    image: service-scheduler:local
    command: ['node', 'dist/persistence/migrate.js']
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Demo data only: `docker compose --profile demo up`.
  seed:
    build: .
    image: service-scheduler:local
    profiles: [demo]
    command: ['node', 'dist/persistence/seed.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - jaeger
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - '16686:16686'

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

volumes:
  pgdata:
