openapi: 3.0.0
paths:
  /health/live:
    get:
      operationId: Health_live
      parameters: []
      responses:
        "200":
          description: The process is running
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - health
  /health/ready:
    get:
      operationId: Health_ready
      parameters: []
      responses:
        "200":
          description: The database is reachable and every migration is applied
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - health
  /v1/service-types:
    get:
      operationId: ServiceTypes_list
      parameters: []
      responses:
        "200":
          description: Every service type, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTypeDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - service-types
  /v1/dealerships/{id}/technicians:
    get:
      operationId: DealershipResources_listTechnicians
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: The dealership's technicians, active or not, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - dealerships
  /v1/dealerships/{id}/bays:
    get:
      operationId: DealershipResources_listBays
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: The dealership's service bays, active or not, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BayDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - dealerships
  /v1/dealerships/{id}/availability:
    get:
      operationId: Availability_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
        - name: serviceTypeId
          required: true
          in: query
          schema:
            format: uuid
            type: string
        - name: date
          required: true
          in: query
          description: A day in the dealership's time zone
          schema:
            format: date
            example: 2026-11-02
            type: string
      responses:
        "200":
          description: "Bookable start times on one local day. Advisory: a booking
            re-checks everything."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - dealerships
  /v1/appointments:
    post:
      description: Assigns the technician and bay itself. Retrying with the same
        Idempotency-Key and request replays the booking instead of creating
        another.
      operationId: Appointments_create
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated key (e.g. a UUID). Retrying with the same key and
            body replays the original result.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentDto"
      responses:
        "200":
          description: "Replay: the Idempotency-Key was already used with the same
            request. Returns the appointment's current representation, which may
            have changed since (e.g. cancelled)."
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                  - "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDto"
        "201":
          description: Booked
          headers:
            Location:
              description: The new appointment
              schema:
                type: string
                example: /v1/appointments/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Book a qualified technician and a compatible bay
      tags:
        - appointments
  /v1/appointments/{id}:
    get:
      operationId: Appointments_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: The appointment in its current state, cancelled or not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - appointments
info:
  title: Service Scheduler API
  description: Books a qualified technician and a compatible service bay for a
    vehicle service. Errors use RFC 9457 application/problem+json.
  version: "1"
  contact: {}
tags: []
servers: []
components:
  schemas:
    FieldErrorDto:
      type: object
      properties:
        field:
          type: string
          example: startAt
        messages:
          example:
            - startAt must be a valid ISO 8601 date string
          type: array
          items:
            type: string
      required:
        - field
        - messages
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          example: https://scheduler.example.com/problems/validation-failed
        title:
          type: string
          example: Request validation failed
        status:
          type: number
          example: 400
        detail:
          type: string
        instance:
          type: string
          example: /v1/appointments
        code:
          type: string
          example: VALIDATION_FAILED
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorDto"
        rule:
          type: string
          example: OUTSIDE_OPENING_HOURS
          description: "BUSINESS_RULE_VIOLATED only: OFF_GRID, TOO_SOON, BEYOND_HORIZON,
            OUTSIDE_OPENING_HOURS or VEHICLE_NOT_OWNED"
        alternatives:
          example:
            - 2026-11-02T03:30:00.000Z
            - 2026-11-02T03:45:00.000Z
          description: "SLOT_UNAVAILABLE only: the next bookable start times after the
            requested one, in UTC. At most 3 by default, searched up to 7 local
            days ahead and never past the booking horizon; may be empty."
          type: array
          items:
            type: string
            format: date-time
      required:
        - type
        - title
        - status
        - code
    ServiceTypeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: EV_BATTERY_CHECK
        name:
          type: string
          example: EV battery health check
        durationMinutes:
          type: integer
          example: 90
          description: Includes bay turnaround time
        requiredSkill:
          type: string
          example: EV_HV
          description: Skill code the technician must hold
        requiredBayType:
          type: string
          example: EV_HV
          description: Bay type code the bay must have
      required:
        - id
        - code
        - name
        - durationMinutes
        - requiredSkill
        - requiredBayType
    TechnicianDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Linh Tran
        skills:
          example:
            - EV_HV
            - GENERAL
          description: Skill codes, sorted
          type: array
          items:
            type: string
        isActive:
          type: boolean
          description: Inactive technicians are never assigned
      required:
        - id
        - displayName
        - skills
        - isActive
    BayDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Bay 3 (EV)
        bayType:
          type: string
          example: EV_HV
        isActive:
          type: boolean
          description: Inactive bays are never assigned
      required:
        - id
        - name
        - bayType
        - isActive
    SlotDto:
      type: object
      properties:
        startAt:
          format: date-time
          type: string
          description: UTC
        endAt:
          format: date-time
          type: string
          description: UTC; the slot is [startAt, endAt)
        freeTechnicians:
          type: integer
          example: 2
          description: Qualified technicians free for the whole slot
        freeBays:
          type: integer
          example: 1
          description: Compatible bays free for the whole slot
      required:
        - startAt
        - endAt
        - freeTechnicians
        - freeBays
    AvailabilityDto:
      type: object
      properties:
        dealershipId:
          type: string
          format: uuid
        serviceTypeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: 2026-11-02
        timeZone:
          type: string
          example: Asia/Ho_Chi_Minh
          description: The dealership's IANA time zone, which `date` is local to
        slots:
          description: Bookable starts on the local grid, in order. Empty for a past day
            or one beyond the booking horizon.
          type: array
          items:
            $ref: "#/components/schemas/SlotDto"
      required:
        - dealershipId
        - serviceTypeId
        - date
        - timeZone
        - slots
    CreateAppointmentDto:
      type: object
      properties:
        dealershipId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          description: Owned by the customer
        serviceTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          example: 2026-11-02T09:00:00+07:00
          description: With an explicit offset (`Z` or `±hh:mm`). On the slot grid of the
            dealership's local day, inside its opening hours.
      required:
        - dealershipId
        - customerId
        - vehicleId
        - serviceTypeId
        - startAt
    AppointmentStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
        - COMPLETED
        - NO_SHOW
    AppointmentVehicleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vin:
          type: string
          example: WVWZZZ1KZAW000001
      required:
        - id
        - vin
    AppointmentServiceTypeDto:
      type: object
      properties:
        code:
          type: string
          example: EV_BATTERY_CHECK
        durationMinutes:
          type: integer
          example: 90
      required:
        - code
        - durationMinutes
    AppointmentTechnicianDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Linh Tran
      required:
        - id
        - displayName
    AppointmentBayDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Bay 3 (EV)
      required:
        - id
        - name
    AppointmentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          example: CONFIRMED
          allOf:
            - $ref: "#/components/schemas/AppointmentStatus"
        dealershipId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        vehicle:
          $ref: "#/components/schemas/AppointmentVehicleDto"
        serviceType:
          $ref: "#/components/schemas/AppointmentServiceTypeDto"
        technician:
          $ref: "#/components/schemas/AppointmentTechnicianDto"
        bay:
          $ref: "#/components/schemas/AppointmentBayDto"
        startAt:
          format: date-time
          type: string
          description: UTC
        endAt:
          format: date-time
          type: string
          description: UTC; the interval is [startAt, endAt)
        createdAt:
          format: date-time
          type: string
        cancelledAt:
          format: date-time
          type: string
          nullable: true
          description: Set only when status is CANCELLED
      required:
        - id
        - status
        - dealershipId
        - customerId
        - vehicle
        - serviceType
        - technician
        - bay
        - startAt
        - endAt
        - createdAt
